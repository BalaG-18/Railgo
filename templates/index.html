<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailGo - Welcome</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0; /* Remove default margin */
            overflow: hidden; /* Hide overflow */
            position: relative; /* Position for absolute children */
        }

        /* Video background */
        video {
            position: absolute; /* Position behind everything */
            top: 50%;
            left: 50%;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            object-fit: cover; /* Cover while maintaining aspect ratio */
            z-index: -1; /* Send video behind other elements */
            transform: translate(-50%, -50%); /* Center the video */
        }

        h1 {
            margin-top: 20px;
            color: #fff; /* Change to white for visibility */
            font-size: 24px;
            position: relative; /* Ensure it stays on top */
            z-index: 1; /* Bring text above video */
        }

        .button-container {
            margin-top: 20px;
            position: relative; /* Ensure it stays on top */
            z-index: 1; /* Bring buttons above video */
        }

        .button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 1em;
            color: #fff;
            background-color: rgba(76, 175, 80, 0.7); /* Slightly transparent green */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s; /* Smooth transition */
        }

        .button:hover {
            background-color: rgba(69, 160, 73, 0.9); /* Darker green on hover */
        }

        /* Styles for attractive alerts */
        .alert-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
            position: relative; /* Ensure it stays on top */
            z-index: 1; /* Bring alerts above video */
        }

        .alert-box {
            position: relative;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .alert-box .alert-icon {
            font-size: 20px;
            margin-right: 10px;
        }

        .alert-box .alert-message {
            flex-grow: 1;
        }

        .alert-box .close-btn {
            cursor: pointer;
            padding: 5px;
            font-size: 18px;
            background: transparent;
            border: none;
            color: white;
        }

        .alert-success {
            background-color: #28a745;
            border: 1px solid #218838;
        }

        .alert-error {
            background-color: #dc3545;
            border: 1px solid #c82333;
        }

        .alert-warning {
            background-color: #ffc107;
            border: 1px solid #e0a800;
            color: #212529;
        }

        .alert-info {
            background-color: #17a2b8;
            border: 1px solid #117a8b;
        }

    </style>
</head>
<body>
    <!-- Attractive Alert Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="alert-container">
            {% for category, message in messages %}
                <div class="alert-box alert-{{ category }}">
                    
                    <span class="alert-message">{{ message }}</span>
                    <span class="close-btn" onclick="this.parentElement.style.display='none';">&times;</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% endwith %}

    <!-- Video Background -->
    <video autoplay muted loop>
        <source src="{{ url_for('static', filename='Your paragraph text3.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    
    <!-- Welcome Message -->
    <h1>Welcome to RailGo</h1>
    
    <!-- Login and Signup Buttons -->
    <div class="button-container">
        <a href="{{ url_for('login') }}" class="button">Login</a>
        <a href="{{ url_for('signup') }}" class="button">Sign Up</a>
    </div>
</body>
</html>
