<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - RailGo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; /* Set margin to 0 for full background coverage */
            padding: 20px;
            background-image: url('{{ url_for('static', filename='image2.png') }}'); /* Set the background image */
            background-size: cover; /* Cover the entire area */
            background-position: center; /* Center the image */
            background-repeat: no-repeat; /* Don't repeat the image */
            height: 100vh; /* Ensure the body takes the full height of the viewport */
        }
        h1 {
            color: #333;
            text-align: center; /* Center align the heading */
        }
        form {
            background: rgba(255, 255, 255, 0.8); /* Add slight transparency */
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            max-width: 400px; /* Set a max width for the form */
            margin: 20px auto; /* Center the form */
        }
        label {
            display: block;
            margin: 10px 0 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%; /* Full width for the button */
        }
        button:hover {
            background-color: #218838;
        }
        /* Styles for attractive alerts */
        .alert-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .alert-box {
            position: relative;
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }
        .alert-box .alert-icon {
            font-size: 20px;
            margin-right: 10px;
        }
        .alert-box .alert-message {
            flex-grow: 1;
        }
        .alert-box .close-btn {
            cursor: pointer;
            padding: 5px;
            font-size: 18px;
            background: transparent;
            border: none;
            color: white;
        }
        .alert-success {
            background-color: #28a745;
            border: 1px solid #218838;
        }
        .alert-error {
            background-color: #dc3545;
            border: 1px solid #c82333;
        }
        .alert-warning {
            background-color: #ffc107;
            border: 1px solid #e0a800;
            color: #212529;
        }
        .alert-info {
            background-color: #17a2b8;
            border: 1px solid #117a8b;
        }
    </style>
</head>
<body>
    <h1>Change Password</h1>

    <!-- Attractive Alert Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="alert-container">
            {% for category, message in messages %}
                <div class="alert-box alert-{{ category }}">
                    
                    <span class="alert-message">{{ message }}</span>
                    <span class="close-btn" onclick="this.parentElement.style.display='none';">&times;</span>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('change_password') }}">
        <label for="old_password">Old Password:</label>
        <input type="password" name="old_password" required>
        
        <label for="new_password">New Password:</label>
        <input type="password" name="new_password" required>
        
        <label for="confirm_password">Confirm New Password:</label>
        <input type="password" name="confirm_password" required>
        
        <button type="submit">Change Password</button>
    </form>

    <a href="{{ url_for('menu_page') }}">Back to Menu</a>

</body>
</html>
